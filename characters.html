<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OC Gallery | DAT Weird FNF Fan</title>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-purple: #9000ff;
            --box-pink: #e6007e;
        }

        body {
            background-color: var(--bg-purple);
            font-family: 'Permanent Marker', cursive;
            margin: 0;
            overflow: hidden;
            color: white;
        }

        /* --- UI Layout --- */
        .main-ui {
            display: grid;
            grid-template-columns: 120px 1fr 350px 120px;
            grid-template-rows: 100px 1fr 150px;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .home-btn {
            position: fixed;
            top: 10px;
            left: 10px;
            background: white;
            color: black;
            padding: 10px 20px;
            border: 3px solid black;
            text-decoration: none;
            z-index: 100;
        }

        .title-card-area {
            grid-column: 2 / 4;
            text-align: center;
        }

        .title-img { height: 80px; filter: drop-shadow(4px 4px 0px black); }

        /* --- Character Stage --- */
        .stage {
            grid-column: 2;
            grid-row: 2 / 4;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
        }

        .char-sprite {
            height: 85%;
            transition: transform 0.6s ease-in-out, opacity 0.6s;
            z-index: 5;
        }

        /* Transition Animations */
        .exit-left { transform: translateX(-120vw); opacity: 0; }
        .exit-right { transform: translateX(120vw); opacity: 0; }
        .enter-from-left { transform: translateX(-120vw); opacity: 0; }
        .enter-from-right { transform: translateX(120vw); opacity: 0; }
        .center-stage { transform: translateX(0); opacity: 1; }

        /* --- Info Side Bar --- */
        .info-sidebar {
            grid-column: 3;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .joke-box {
            background: var(--box-pink);
            border: 4px solid black;
            padding: 10px;
            transform: rotate(-2deg);
            box-shadow: 6px 6px 0px black;
        }

        .bio-box {
            background: white;
            color: black;
            border: 4px solid black;
            padding: 15px;
            font-family: sans-serif; /* Cleaner font for reading bios */
            font-weight: bold;
            font-size: 1.1rem;
            max-height: 200px;
            overflow-y: auto;
        }

        .gallery-preview {
            background: var(--box-pink);
            border: 4px solid black;
            padding: 10px;
            cursor: pointer;
            text-align: center;
        }

        .gallery-preview img { width: 100%; border: 2px solid black; }

        .arrow-btn {
            grid-row: 2;
            background: none;
            border: none;
            color: white;
            font-size: 6rem;
            -webkit-text-stroke: 3px black;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <a href="index.html" class="home-btn">🏠 GO BACK</a>

    <div class="main-ui">
        <button class="arrow-btn" onclick="changeChar(-1)">◀</button>

        <div class="title-card-area">
            <img id="title-img" src="" class="title-img">
        </div>

        <div class="stage">
            <img id="main-sprite" src="" class="char-sprite">
        </div>

        <div class="info-sidebar">
            <div class="joke-box">
                <p id="joke-text" style="margin:0; font-size: 1.5rem;"></p>
            </div>
            <div class="bio-box">
                <p id="bio-text" style="margin:0;"></p>
            </div>
            <div class="gallery-preview" onclick="alert('Gallery opening...')">
                <p style="margin:0 0 5px 0;">ART GALLERY</p>
                <img id="extra-img" src="">
            </div>
        </div>

        <button class="arrow-btn" onclick="changeChar(1)">▶</button>
    </div>

    <script>
        const characters = [
            {
                id: "Ivy",
                joke: "She is A stupid idiot.",
                bio: "Ivy is a rhythmic traveler with a knack for getting into rap battles she isn't prepared for. Despite the 'idiot' label, she has a heart of gold and never misses a beat.",
                walkingFrames: 2, // costume8 and costume9
                extraImages: 1
            },
            {
                id: "Example2",
                joke: "Literally a rock.",
                bio: "This is a placeholder for your second character. They don't do much, but they are very solid.",
                walkingFrames: 1,
                extraImages: 1
            }
        ];

        let index = 0;
        let isMoving = false;
        const sprite = document.getElementById('main-sprite');

        function loadData(i) {
            const c = characters[i];
            document.getElementById('title-img').src = `images/characters/${c.id}/title_card.png`;
            document.getElementById('joke-text').innerText = c.joke;
            document.getElementById('bio-text').innerText = c.bio;
            document.getElementById('extra-img').src = `images/characters/${c.id}/extra/1.png`;
            sprite.src = `images/characters/${c.id}/walking/1.png`;
        }

        function changeChar(dir) {
            if (isMoving) return;
            isMoving = true;

            // 1. Exit current character
            if (dir === 1) sprite.className = "char-sprite exit-left";
            else sprite.className = "char-sprite exit-right";

            setTimeout(() => {
                // 2. Update data
                index = (index + dir + characters.length) % characters.length;
                loadData(index);

                // 3. Position new character at OPPOSITE side
                if (dir === 1) sprite.className = "char-sprite enter-from-right";
                else sprite.className = "char-sprite enter-from-left";

                // 4. Slide to center
                setTimeout(() => {
                    sprite.className = "char-sprite center-stage";
                    isMoving = false;
                }, 50);
            }, 600);
        }

        // Initial Load
        loadData(0);
    </script>
</body>
</html>
