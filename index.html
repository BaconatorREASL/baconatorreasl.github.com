<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAT Weird FNF Fan | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Permanent+Marker&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --fnf-purple: #6a32ff;
            --fnf-light-purple: #a282ff;
            --fnf-grey: #808080;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--fnf-purple);
            font-family: 'Permanent Marker', cursive;
            color: white;
            overflow-x: hidden;
        }

        /* --- Header Section --- */
        header {
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .logo-container {
            background: var(--fnf-light-purple);
            border: 6px solid black;
            border-radius: 60px;
            padding: 15px 30px;
            box-shadow: 8px 8px 0px black;
            max-width: 90%;
        }

        .logo-img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* --- White Slanted Bar --- */
        .middle-bar {
            background: white;
            color: black;
            padding: 60px 20px;
            transform: skewY(-3deg); /* Creates the slant from your drawing */
            margin: 20px 0;
            border-top: 6px solid black;
            border-bottom: 6px solid black;
            text-align: center;
        }

        .content-wrapper {
            transform: skewY(3deg); /* Straightens text back out */
        }

        h2 { font-size: 2.5rem; margin: 0; }
        .random-box { font-size: 1.8rem; margin-top: 10px; }
        #fact-text { font-style: italic; }

        /* --- Navigation Menu --- */
        nav {
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* Aligns to the left like your drawing */
            max-width: 800px;
            margin: 0 auto;
        }

        nav ul {
            list-style: none;
            padding: 0;
        }

        nav li {
            margin: 20px 0;
            position: relative;
        }

        nav a {
            text-decoration: none;
            color: white;
            font-size: 3rem;
            -webkit-text-stroke: 2px black;
            padding: 5px 25px;
            display: inline-block;
            transition: transform 0.1s;
        }

        /* --- Hover Effects: Grey Box & Arrow --- */
        nav a:hover {
            background-color: var(--fnf-grey);
            color: white;
            cursor: pointer;
        }

        /* The Arrow ▶ */
        nav a:hover::before {
            content: "▶";
            position: absolute;
            left: -50px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2.5rem;
            color: white;
            -webkit-text-stroke: 2px black;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 1rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <audio id="hover-sfx">
        <source src="hover.mp3" type="audio/mpeg">
    </audio>

    <header>
        <div class="logo-container">
            <img src="backdrop1 (2).png" alt="D AT weird FNF fan" class="logo-img">
        </div>
    </header>

    <div class="middle-bar">
        <div class="content-wrapper">
            <h2>Welcome to my Pointless website!!!!</h2>
            <p class="random-box">Random message: <span id="fact-text">I Exist, I guess.</span></p>
        </div>
    </div>

    <nav>
        <ul>
            <li><a href="#" class="menu-item">About me?</a></li>
            <li><a href="#" class="menu-item">Projects</a></li>
            <li><a href="#" class="menu-item">Social media</a></li>
            <li><a href="#" class="menu-item">My Original characters</a></li>
        </ul>
    </nav>

    <footer>
        &copy; 2026 DAT Weird FNF Fan
    </footer>

    <script>
        // 1. Random Message Logic
        const messages = [
            "I Exist, I guess.",
            "Beep Boop Skdoo Bep!",
            "Probably playing FNF right now.",
            "This website is 100% pointless!",
            "Wait, why are you still here?",
            "Original Characters are cool.",
            "Error 404: Brain not found."
        ];

        function changeMessage() {
            const textElement = document.getElementById('fact-text');
            const randomIndex = Math.floor(Math.random() * messages.length);
            textElement.innerText = messages[randomIndex];
        }

        // 2. Sound Logic
        const hoverSound = document.getElementById('hover-sfx');
        const menuItems = document.querySelectorAll('.menu-item');

        menuItems.forEach(item => {
            item.addEventListener('mouseenter', () => {
                hoverSound.currentTime = 0; // Rewind to start
                hoverSound.play().catch(e => console.log("Sound blocked until user clicks page once."));
            });
        });

        // Initialize random message on load
        window.onload = changeMessage;
    </script>
</body>
</html>
