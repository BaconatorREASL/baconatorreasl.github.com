<<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAT Weird FNF Fan | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Permanent+Marker&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --fnf-purple: #6a32ff;
            --fnf-light-purple: #a282ff;
            --fnf-grey: #808080;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--fnf-purple);
            font-family: 'Permanent Marker', cursive;
            color: white;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .logo-container {
            background: var(--fnf-light-purple);
            border: 6px solid black;
            border-radius: 60px;
            padding: 15px 30px;
            box-shadow: 8px 8px 0px black;
            max-width: 90%;
        }

        .logo-img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .white-bar {
            background: white;
            color: black;
            padding: 60px 20px;
            transform: skewY(-3deg);
            margin: 20px 0;
            border-top: 6px solid black;
            border-bottom: 6px solid black;
            text-align: center;
        }

        .content-wrapper {
            transform: skewY(3deg);
        }

        h2 { font-size: 2.5rem; margin: 0; }
        .random-box { font-size: 1.8rem; margin-top: 10px; }

        nav {
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            max-width: 800px;
            margin: 0 auto;
        }

        nav ul {
            list-style: none;
            padding: 0;
        }

        nav li {
            margin: 20px 0;
            position: relative;
        }

        nav a {
            text-decoration: none;
            color: white;
            font-size: 3rem;
            -webkit-text-stroke: 2px black;
            padding: 5px 25px;
            display: inline-block;
        }

        /* Hover: Grey Box & Arrow */
        nav a:hover {
            background-color: var(--fnf-grey);
            color: white;
            cursor: pointer;
        }

        nav a:hover::before {
            content: "▶";
            position: absolute;
            left: -50px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2.5rem;
            color: white;
            -webkit-text-stroke: 2px black;
        }

        footer {
            text-align: center;
            padding: 20px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <audio id="hover-sfx">
        <source src="sounds/hover.wav" type="audio/mpeg">
    </audio>

    <header>
        <div class="logo-container">
            <img src="images/backdrop1 (2).png" alt="DAT weird FNF fan" class="logo-img">
        </div>
    </header>

    <div class="white-bar">
        <div class="white-bar-content">
            <h2 class="welcome-title">Welcome to my Pointless website!!!!</h2>
            <p class="random-box">Random message: <span id="fact-text">I Exist, I guess.</span></p>
        </div>
    </div>

    <nav>
        <ul>
            <li><a href="#" class="menu-item">About me? (hasn't been made)</a></li>
            <li><a href="projects.html" class="menu-item">Projects (wip)</a></li>
            <li><a href="#" class="menu-item">Social media (hasn't been made)</a></li>
            <li><a href="characters.html" class="menu-item">My Original characters (wip and broken)</a></li>
            <li><a href="#" class="menu-item">My music (hasn't been made)</a></li>
        </ul>
    </nav>

    <footer>
        lmao
    </footer>

    <script>
        const messages = [
            "I Exist, I guess.",
            "please go play smash remix, i beg you!",
            "Beep Boop Skdoo Bep!",
            "Yeeep!!",
            "Probably playing FNF right now.",
            "most likely playing YEEPS right now.",
            "composing a shitty fnf song.",
            "fun fact!: did you know that This website is 100% pointless!",
            "Wait, why are you still here?",
            "am a proud 100% certified d-side gf gooner",
            "You will hear from our lawyers Monday - Gus probably",
            "pico is cool.",
            "you guys are telling me that fnf got a collab instead of week 8, WHAT THE FUCK FNF DEVS!? (the update is ok tho).",
            "Error 404: i have eaten the code cuz i was very hungry"
        ];

        function changeMessage() {
            const textElement = document.getElementById('fact-text');
            const randomIndex = Math.floor(Math.random() * messages.length);
            textElement.innerText = messages[randomIndex];
        }

        const hoverSound = document.getElementById('hover-sfx');
        const menuItems = document.querySelectorAll('.menu-item');

        menuItems.forEach(item => {
            item.addEventListener('mouseenter', () => {
                hoverSound.currentTime = 0;
                hoverSound.play().catch(e => {
                   
                    console.log("Interaction required for sound.");
                });
            });
        });

        window.onload = changeMessage;
    </script>
</body>
</html>
