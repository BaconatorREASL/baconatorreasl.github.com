<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music | DAT Weird FNF Fan</title>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        :root {
            --fnf-purple: #6a32ff;
            --fnf-grey: #808080;
            --box-black: #000;
        }

        body {
            margin: 0;
            background-color: var(--fnf-purple);
            font-family: 'Permanent Marker', cursive;
            color: white;
            overflow: hidden; /* Keeps it like a game menu */
        }

        /* Home Button */
        .back-btn {
            position: absolute;
            top: 20px; left: 20px;
            padding: 10px 20px;
            background: white; color: black;
            text-decoration: none;
            border: 4px solid black;
            box-shadow: 4px 4px 0px black;
            z-index: 100;
        }

        /* --- Main Layout --- */
        .music-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
            padding: 50px;
            box-sizing: border-box;
            gap: 20px;
            align-items: center;
        }

        /* --- Left Side: The Player --- */
        .player-box {
            background: white;
            border: 6px solid black;
            padding: 30px;
            color: black;
            transform: rotate(-2deg);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.5);
        }

        /* Album Art / Spinning Disc */
        .album-art {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 8px solid black;
            background: #333;
            object-fit: cover;
            margin-bottom: 20px;
            transition: transform 0.5s;
        }

        .spinning { animation: spin 4s linear infinite; }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .song-info h2 { font-size: 2rem; margin: 0; text-align: center; }
        .song-info p { font-family: sans-serif; font-weight: bold; margin: 5px 0 20px 0; text-align: center; color: #555; }

        /* Custom Audio Controls */
        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .ctrl-btn {
            background: black;
            color: white;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            width: 60px; height: 60px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.1s;
        }
        .ctrl-btn:hover { background: var(--fnf-purple); transform: scale(1.1); }
        .ctrl-btn:active { transform: scale(0.9); }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            background: #ddd;
            height: 20px;
            border: 3px solid black;
            margin-top: 20px;
            position: relative;
            cursor: pointer;
        }
