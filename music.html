<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music | DAT Weird FNF Fan</title>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        :root {
            --fnf-purple: #6a32ff;
            --fnf-grey: #808080;
        }

        body {
            margin: 0;
            background-color: var(--fnf-purple);
            font-family: 'Permanent Marker', cursive;
            color: white;
            overflow: hidden;
        }

        .back-btn {
            position: absolute;
            top: 20px; left: 20px;
            padding: 10px 20px;
            background: white; color: black;
            text-decoration: none;
            border: 4px solid black;
            box-shadow: 4px 4px 0px black;
            z-index: 100;
        }

        .music-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
            padding: 50px;
            box-sizing: border-box;
            gap: 20px;
            align-items: center;
        }

        .player-box {
            background: white;
            border: 6px solid black;
            padding: 30px;
            color: black;
            transform: rotate(-2deg);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.5);
        }

        .album-art {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 8px solid black;
            background: #333;
            object-fit: cover;
            margin-bottom: 20px;
        }

        .spinning { animation: spin 4s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .song-info h2 { font-size: 2rem; margin: 0; text-align: center; }
        .song-info p { font-family: sans-serif; font-weight: bold; margin: 5px 0 20px 0; text-align: center; color: #555; }

        .controls { display: flex; gap: 20px; align-items: center; }

        .ctrl-btn {
            background: black;
            color: white;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            width: 60px; height: 60px;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
        }

        .progress-container {
            width: 100%;
            background: #ddd;
            height: 20px;
            border: 3px solid black;
            margin-top: 20px;
            position: relative;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: var(--fnf-purple);
            width: 0%;
            pointer-events: none; /* This fixes the 'broken' seek bar */
        }

        .playlist-box {
            height: 80vh;
            overflow-y: auto;
            padding-right: 20px;
        }

        .song-item {
            display: block;
            font-size: 2.2rem;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            margin-bottom: 15px;
            -webkit-text-stroke: 2px black;
            position: relative;
            transition: transform 0.1s;
        }

        .song-item:hover {
            background-color: var(--fnf-grey);
            cursor: pointer;
            transform: translateX(20px);
        }

        .song-item:hover::before {
            content: "▶";
            position: absolute;
            left: -40px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 2rem;
        }

        .active-song { color: #ffff00; }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">◀ HOME</a>

    <div class="music-container">
        <div class="player-box">
            <img id="album-art" src="images/music_icon.png" class="album-art">
            <div class="song-info">
                <h2 id="track-title">SELECT A SONG</h2>
                <p id="track-artist">To start listening</p>
            </div>
            <div class="controls">
                <button class="ctrl-btn" onclick="prevSong()">⏮</button>
                <button class="ctrl-btn" onclick="togglePlay()" id="play-btn">▶</button>
                <button class="ctrl-btn" onclick="nextSong()">⏭</button>
            </div>
            <div class="progress-container" id="p-bar" onclick="seek(event)">
                <div id="progress" class="progress-fill"></div>
            </div>
        </div>

        <div class="playlist-box" id="playlist"></div>
    </div>

    <audio id="main-audio"></audio>
    <audio id="hover-sfx" src="sounds/hover.mp3"></audio>

    <script>
        const songs = [
            { title: "YEEPER V3", artist: "Funky Puppet", file: "sounds/music/yeepet.mp3", cover: "images/music/yeepers.png" },
            { title: "GUY v2", artist: "Vs guy", file: "sounds/music/song2.mp3", cover: "images/vs_guy.jpg" },
            { title: "emptiness v2.5", artist: "VS YEEP", file: "sounds/music/song3.mp3", cover: "images/music_icon.png" }
        ];

        let currentIdx = 0;
        let isPlaying = false;
        const audio = document.getElementById('main-audio');
        const playBtn = document.getElementById('play-btn');
        const albumArt = document.getElementById('album-art');

        // Setup Playlist
        songs.forEach((song, index) => {
            const div = document.createElement('div');
            div.className = 'song-item';
            div.innerText = song.title;
            div.onclick = () => loadSong(index);
            document.getElementById('playlist').appendChild(div);
        });

        function loadSong(index) {
            currentIdx = index;
            const song = songs[index];
            document.getElementById('track-title').innerText = song.title;
            document.getElementById('track-artist').innerText = song.artist;
            albumArt.src = song.cover;
            
            audio.src = song.file;
            audio.load();
            playMusic();
            updateActiveList();
        }

        function playMusic() {
            // Unlocks audio for the browser
            audio.play().then(() => {
                isPlaying = true;
                playBtn.innerText = "||";
                albumArt.classList.add('spinning');
            }).catch(e => console.log("Click a song to start music!"));
        }

        function pauseMusic() {
            audio.pause();
            isPlaying = false;
            playBtn.innerText = "▶";
            albumArt.classList.remove('spinning');
        }

        function togglePlay() {
            if (!audio.src) return;
            if (isPlaying) pauseMusic(); else playMusic();
        }

        function nextSong() { currentIdx = (currentIdx + 1) % songs.length; loadSong(currentIdx); }
        function prevSong() { currentIdx = (currentIdx - 1 + songs.length) % songs.length; loadSong(currentIdx); }

        function updateActiveList() {
            const items = document.querySelectorAll('.song-item');
            items.forEach((item, idx) => {
                item.classList.toggle('active-song', idx === currentIdx);
            });
        }

        audio.ontimeupdate = () => {
            if (audio.duration) {
                document.getElementById('progress').style.width = (audio.currentTime / audio.duration) * 100 + "%";
            }
        };

        function seek(e) {
            const rect = document.getElementById('p-bar').getBoundingClientRect();
            const x = e.clientX - rect.left;
            audio.currentTime = (x / rect.width) * audio.duration;
        }

        audio.onended = nextSong;
    </script>
</body>
</html>
